appname = caslingo
httpport = 16500
runmode = dev
copyrequestbody = true
; database: sqlite (dbName is the file) or mysql (dataSourceName + dbName, the database and tables are created when missing)
driverName = sqlite
dataSourceName =
dbName = caslingo.db
; site name and logo shown in the header and the browser tab
siteName = Caslingo
logoUrl =
faviconUrl =
footerHtml =
; Casdoor sign-in. Write clientSecret only in the app.conf on the server or pass it as an environment variable, and do not commit it
casdoorEndpoint =
clientId =
clientSecret =
casdoorOrganization =
casdoorApplication =
; who can create projects and manage every project: Casdoor user names, comma-separated (Casdoor's own admins are always in)
admins = admin
; sign in as "admin" without Casdoor, only from this computer (127.0.0.1); for local development only, never on a server
devSignin = false
; where the project repositories are cloned, and uploaded source files are kept
reposDir = repos
filesDir = files
webDir = web/build
; machine translation: any OpenAI-compatible chat API, e.g. https://dashscope.aliyuncs.com/compatible-mode/v1 with qwen-flash
aiBaseUrl =
aiModel =
aiApiKey =
; strings sent to the model in one request, and requests running at the same time
aiBatchSize = 40
aiConcurrency = 4
; pull every project's repository every this many minutes (0 = only on webhooks and the Update button)
syncIntervalMinutes = 0
; behind CasWAF / Nginx, take the client IP from X-Forwarded-For
trustProxyHeader = false
